<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Nostra</title>
<script>
  if (localStorage.getItem("nostra-theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#f3efe6] text-[#16181d] dark:bg-[#111317] dark:text-[#e5e2d9] overflow-x-hidden transition-colors">

  <div id="promo-bar" class="bg-[#16181d] text-white text-xs sm:text-sm text-center py-2.5 px-8 sm:px-10 relative">
    <span>Sign Up and <strong class="font-semibold">GET 20% OFF</strong> for your first Order</span>
    <button id="promo-close" aria-label="Dismiss" class="absolute right-3 sm:right-4 top-1/2 -translate-y-1/2 text-white/70 hover:text-white">✕</button>
  </div>

  <header class="bg-[#f3efe6] dark:bg-[#1b1d23] border-b border-[#dcd6c8] dark:border-[#2a2d34] transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex items-center justify-between">
      <a href="index.html" class="text-lg sm:text-xl font-bold tracking-tight">Nostra</a>
      <nav class="hidden md:flex items-center gap-8 text-sm">
        <a href="index.html" class="hover:text-[#c65b3f]">Home</a>
        <a href="index.html#new-arrival" class="hover:text-[#c65b3f]">New Arrival</a>
        <a href="index.html#most-wanted" class="hover:text-[#c65b3f]">Most Wanted</a>
        <a href="collections.html" class="hover:text-[#c65b3f]">Collections</a>
        <a href="contact.html" class="hover:text-[#c65b3f]">Contact Us</a>
      </nav>
      <div class="flex items-center gap-3 sm:gap-4">
        <button id="theme-toggle" aria-label="Toggle dark mode" class="text-lg leading-none">🌙</button>
        <a href="cart.html" aria-label="Cart" class="relative hover:text-[#c65b3f]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span data-cart-count class="hidden absolute -top-2 -right-2 bg-[#c65b3f] text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </a>
        <button id="nav-toggle" class="md:hidden" aria-label="Open menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile right-side drawer -->
  <div id="mobile-backdrop" class="fixed inset-0 bg-black/50 z-40 md:hidden"></div>
  <aside id="mobile-drawer" class="fixed top-0 right-0 h-full w-72 max-w-[80%] bg-[#f3efe6] dark:bg-[#1b1d23] z-50 md:hidden shadow-2xl flex flex-col">
    <div class="flex items-center justify-between px-5 py-5 border-b border-[#dcd6c8] dark:border-[#2a2d34]">
      <span class="text-lg font-bold">Menu</span>
      <button id="drawer-close" aria-label="Close menu" class="text-2xl leading-none">✕</button>
    </div>
    <nav class="flex flex-col gap-1 p-5 text-sm">
      <a href="index.html" class="py-3 border-b border-[#dcd6c8] dark:border-[#2a2d34]">Home</a>
      <a href="index.html#new-arrival" class="py-3 border-b border-[#dcd6c8] dark:border-[#2a2d34]">New Arrival</a>
      <a href="index.html#most-wanted" class="py-3 border-b border-[#dcd6c8] dark:border-[#2a2d34]">Most Wanted</a>
      <a href="collections.html" class="py-3 border-b border-[#dcd6c8] dark:border-[#2a2d34]">Collections</a>
      <a href="contact.html" class="py-3 border-b border-[#dcd6c8] dark:border-[#2a2d34]">Contact Us</a>
      <a href="cart.html" class="py-3">Cart</a>
    </nav>
  </aside>

  <main id="product-root" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 grid md:grid-cols-2 gap-6 md:gap-12">
    <!-- filled by product.js -->
  </main>

  <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-12 sm:pb-16">
    <h2 class="text-lg sm:text-xl font-display font-bold mb-5 sm:mb-6">You may also like</h2>
    <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-5"></div>
  </section>

  <footer class="bg-[#171d29] text-white/80 transition-colors">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-12 text-center">
      <p class="text-white text-xl font-bold mb-3">Nostra</p>
      <p class="text-sm max-w-md mx-auto">Nostra brings you stylish, comfortable, and quality fashion for every occasion.</p>
    </div>
    <div class="border-t border-white/10 py-5 text-center text-xs text-white/50 px-4">© 2026 Nostra.com</div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/site.js"></script>
  <script src="js/product.js"></script>
</body>
</html>

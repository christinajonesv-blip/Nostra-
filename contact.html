<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us — Nostra</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#f3efe6] text-[#16181d] overflow-x-hidden">

  <div id="promo-bar" class="bg-[#16181d] text-white text-xs sm:text-sm text-center py-2.5 px-8 sm:px-10 relative">
    <span>Sign Up and <strong class="font-semibold">GET 20% OFF</strong> for your first Order</span>
    <button id="promo-close" aria-label="Dismiss" class="absolute right-3 sm:right-4 top-1/2 -translate-y-1/2 text-white/70 hover:text-white">✕</button>
  </div>

  <header class="bg-[#f3efe6] border-b border-[#dcd6c8]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex items-center justify-between">
      <a href="index.html" class="text-lg sm:text-xl font-bold tracking-tight">Nostra</a>
      <nav class="hidden md:flex items-center gap-8 text-sm">
        <a href="index.html" class="hover:text-[#c65b3f]">Home</a>
        <a href="index.html#new-arrival" class="hover:text-[#c65b3f]">New Arrival</a>
        <a href="index.html#most-wanted" class="hover:text-[#c65b3f]">Most Wanted</a>
        <a href="collections.html" class="hover:text-[#c65b3f]">Collections</a>
        <a href="contact.html" class="text-[#c65b3f]">Contact Us</a>
      </nav>
      <button id="nav-toggle" class="md:hidden" aria-label="Menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <nav id="mobile-menu" class="md:hidden px-4 sm:px-6 flex flex-col gap-1 text-sm pb-2">
      <a href="index.html" class="py-2">Home</a>
      <a href="index.html#new-arrival" class="py-2">New Arrival</a>
      <a href="index.html#most-wanted" class="py-2">Most Wanted</a>
      <a href="collections.html" class="py-2">Collections</a>
      <a href="contact.html" class="py-2">Contact Us</a>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
    <div class="bg-[#171d29] text-white rounded-xl p-6 sm:p-8 md:p-12">
      <h1 class="text-xl sm:text-2xl font-display font-bold mb-6 sm:mb-8">Contact Us</h1>
      <form id="contact-form" class="space-y-5 sm:space-y-6">
        <div>
          <label for="name" class="block text-sm mb-2">Name:</label>
          <input id="name" name="name" type="text" required class="w-full rounded-md px-4 py-3 text-[#16181d] focus:outline-none focus:ring-2 focus:ring-[#c65b3f]" />
        </div>
        <div>
          <label for="email" class="block text-sm mb-2">Email:</label>
          <input id="email" name="email" type="email" required class="w-full rounded-md px-4 py-3 text-[#16181d] focus:outline-none focus:ring-2 focus:ring-[#c65b3f]" />
        </div>
        <div>
          <label for="message" class="block text-sm mb-2">Message:</label>
          <textarea id="message" name="message" rows="5" required class="w-full rounded-md px-4 py-3 text-[#16181d] focus:outline-none focus:ring-2 focus:ring-[#c65b3f]"></textarea>
        </div>
        <button type="submit" class="w-full sm:w-auto bg-[#3b6fc9] hover:bg-[#3562b3] transition text-white font-medium px-6 py-3 rounded-md">Send Message</button>
        <p id="form-success" class="hidden text-sm text-[#8fd19e]">Thanks — we'll get back to you shortly.</p>
      </form>
    </div>
  </main>

  <footer class="bg-[#171d29] text-white/70 text-center text-xs py-6 mt-6 px-4">© 2026 Nostra. All rights reserved.</footer>

  <script src="js/site.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
